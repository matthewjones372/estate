name: image

# Once the gate has passed on main, the image is built for amd64 and arm64 and pushed to GitHub's registry as
# ghcr.io/<owner>/estate, tagged main, main-<run>-<sha> and the commit's sha, so a deploy can pin one or follow main.
on:
  workflow_run:
    workflows: [ gate ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image and its tags
        id: names
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/estate"
          {
            echo "tags<<EOF"
            echo "$image:main"
            echo "$image:main-${{ github.run_number }}-${sha::7}"
            echo "$image:$sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Operational context layer: alert to context to investigation — not a Grafana replacement.
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

