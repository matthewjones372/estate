name: dependabot

# Dependabot's pull requests are set to merge themselves once the gate passes. Nothing from the pull request is
# checked out or run here; GitHub merges only when the branch's required checks are green.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v2
      - run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
