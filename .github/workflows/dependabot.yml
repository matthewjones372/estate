name: dependabot

# A Dependabot pull request is merged once the gate has passed on it, and only the commit that passed. This runs
# after the gate, from the default branch's copy of this file; nothing from the pull request is checked out or run.
on:
  workflow_run:
    workflows: [ gate ]
    types: [ completed ]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge "$BRANCH" --repo "$REPOSITORY" --squash --match-head-commit "$SHA"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
