name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run gate
      # The benchmark measures the code, so a change to Markdown or docs/ alone skips it. Anything else, or a base
      # that cannot be compared against, runs it.
      - id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only Markdown and docs/ changed, so the benchmark is skipped."
          fi
      # It takes seconds, but now and then hangs on the runner's package mirror; failing fast lets it be run again.
      - if: steps.changed.outputs.code == 'true'
        timeout-minutes: 5
        run: bunx playwright install --with-deps chromium
      - if: steps.changed.outputs.code == 'true'
        run: bun run perf
