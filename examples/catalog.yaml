# An example estate: a small shop in two environments.
environments:
  - name: staging
    title: Staging, one machine
    sources: staging
  - name: production
    title: Production, three machines
    sources: production

# AI agents run in production, their usage from OpenTelemetry's GenAI metrics in the environment's Prometheus.
agents:
  - name: support-triage
    category: Shop
    owner: web
    description: Sorts customers' emails and drafts replies
    environments: [ production ]
    usage:
      runs: sum(rate(gen_ai_client_operation_duration_seconds_count{gen_ai_agent_name="support-triage"}[5m]))
      errors: sum(rate(gen_ai_client_operation_duration_seconds_count{gen_ai_agent_name="support-triage",error_type!=""}[5m]))
      p99: histogram_quantile(0.99, sum by (le) (rate(gen_ai_client_operation_duration_seconds_bucket{gen_ai_agent_name="support-triage"}[5m])))
      tokens: sum(rate(gen_ai_client_token_usage_sum{gen_ai_agent_name="support-triage"}[5m])) * 3600
      spent: sum(increase(gen_ai_client_token_usage_sum{gen_ai_agent_name="support-triage"}[1d]))
      model: group by (gen_ai_response_model) (gen_ai_client_token_usage_count{gen_ai_agent_name="support-triage"})
    budget: { tokens: 20000000, per: day }
    runs: { langfuse: { name: support-triage } }
    links: { traces: 'https://grafana.example.com/explore?var-env={env}&agent={agent}' }

# Who owns what: a service's, job's or agent's owner names one of these, and its links go wherever that owner is shown.
teams:
  - name: web
    title: Web
    links:
      slack: https://example.slack.com/archives/C0WEB
      confluence: https://example.atlassian.net/wiki/spaces/WEB
      oncall: https://example.pagerduty.com/schedules/PWEB
  - name: orders
    title: Orders
    links:
      slack: https://example.slack.com/archives/C0ORDERS
      notion: https://www.notion.so/example/Orders
  - name: payments
    title: Payments
    links:
      teams: https://teams.microsoft.com/l/channel/payments
      confluence: https://example.atlassian.net/wiki/spaces/PAY

services:
  - name: storefront
    category: Shop
    description: The pages customers browse and buy from
    owner: web
    repository: github:example/storefront
    build: { workflow: build.yml }
    runbook: https://example.com/runbooks/storefront
    environments: [ staging, production ]
    kubernetes: { namespace: shop, workloads: [ { kind: Deployment, name: storefront } ] }
    deploy: { flux: { kustomization: shop, imagePolicy: storefront } }
    load:
      requests: sum(rate(http_requests_total{app="storefront"}[1m]))
      errors: sum(rate(http_requests_total{app="storefront",code=~"5.."}[1m]))
      p99: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{app="storefront"}[5m])))
    links:
      logs: https://grafana.example.com/explore?env={env}&logs={namespace}/{service}
      dashboard: https://grafana.example.com/d/{service}?var-env={env}
      api: https://{service}.{env}.example.com/swagger-ui
      app: https://shop.{env}.example.com
      # Raise incident opens this URL (PagerDuty / Opsgenie / …). Estate does not create incidents.
      incident: https://example.pagerduty.com/incidents/create?service={service}&env={env}&title={alert}&details={summary}
    debug: { configMap: storefront-logging, key: level, levels: [ INFO, DEBUG ] }
    stats: { preset: container }

  - name: orders
    category: Payments
    description: Baskets become orders, and orders are tracked to the door
    owner: orders
    repository: github:example/orders
    build: { github: { workflow: build.yml } }
    # Or built by GitLab CI, or by a Jenkins job (its folders, and a multibranch job's branch):
    # build: { gitlab: { project: shop/orders, ref: main } }
    # build: { jenkins: { job: shop/orders, branch: main } }
    # build: { teamcity: { buildType: Shop_Orders, branch: main } }
    # build: { harness: { org: default, project: shop, pipeline: orders_ci } }
    # And deployed by Harness CD, where an environment's sources name harness:
    # deploy: { harness: { org: default, project: shop, pipeline: orders_cd } }
    environments: [ staging, production ]
    runtime: { kubernetes: { namespace: shop, workloads: [ { kind: Deployment, name: orders } ] } }
    jobs: [ { kind: CronJob, name: orders-nightly-export } ]
    deploy: { flux: { kustomization: shop, imagePolicy: orders } }
    load:
      requests: sum(rate(http_requests_total{app="orders"}[1m]))
      errors: sum(rate(http_requests_total{app="orders",code=~"5.."}[1m]))
      p99: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{app="orders"}[5m])))
    links:
      logs: https://grafana.example.com/explore?env={env}&logs={namespace}/{service}
      traces: https://grafana.example.com/explore?env={env}&traces={service}
    stats:
      preset: jvm
      extra:
        - { title: Orders waiting, query: 'sum(orders_waiting{app="orders"})' }

  - name: payments
    category: Payments
    description: Takes the money, through the card provider
    owner: payments
    repository: github:example/payments
    environments: [ production ]
    kubernetes: { namespace: payments, workloads: [ { kind: StatefulSet, name: payments } ] }
    load:
      requests: sum(rate(payments_total[1m]))
      errors: sum(rate(payments_total{outcome="error"}[1m]))

  - name: search
    category: Shop
    description: Finds products as customers type
    owner: web
    environments: [ staging, production ]
    kubernetes: { namespace: shop, workloads: [ { kind: Deployment, name: search } ] }

stores:
  - name: orders-db
    category: Payments
    description: Orders, baskets and deliveries
    environments: [ staging, production ]
    engine: postgres
    selector: 'datname="orders"'
    links: { dashboard: 'https://grafana.example.com/d/postgres?var-env={env}&var-db={store}' }
  - name: cache
    category: Shop
    description: Sessions and product pages
    environments: [ staging, production ]
    engine: redis
    selector: 'instance="cache:9121"'
  - name: events
    description: Orders placed and paid, for whoever listens
    environments: [ production ]
    engine: kafka
    selector: 'job="kafka"'
    attention: { underReplicated: 0 }

# Jobs no service owns: a CronJob or Job by name in its namespace, or an ECS scheduled task in its cluster.
jobs:
  - name: settlement
    category: Payments
    owner: payments
    description: Settles the day's card payments with the provider
    environments: [ production ]
    run: { kubernetes: { namespace: batch, cronJob: payments-settlement } }
    links: { logs: 'https://grafana.example.com/explore?var-env={env}&namespace={namespace}&job={job}' }

# What an alert means for the people using the shop, by its name, kept in code. A rule's own `impact` annotation
# says it too, and an operator can write it on the page, which comes first.
alerts:
  OrdersSlow: { impact: "Customers wait to place orders, and some give up." }

vitals:
  - title: Orders
    query: sum(rate(orders_placed_total[5m]))
    unit: /s
  - title: Basket to order
    query: sum(rate(orders_placed_total[1h])) / sum(rate(baskets_created_total[1h])) * 100
    unit: "%"

map:
  nodes:
    - { id: storefront, service: storefront }
    - { id: search, service: search }
    - { id: orders, service: orders }
    - { id: payments, service: payments }
    - { id: db, title: Postgres, store: orders-db }
    - { id: cards, title: Card provider, kind: external }
  edges:
    - { from: storefront, to: search, label: search, rate: 'sum(rate(search_requests_total[1m]))' }
    - { from: storefront, to: orders, label: orders, rate: 'sum(rate(http_requests_total{app="orders"}[1m]))' }
    - { from: orders, to: payments, label: pay, rate: 'sum(rate(payments_total[1m]))', alert: PaymentsSlow }
    - { from: orders, to: db, label: writes }
    - { from: payments, to: cards, label: charges }
