# Estate's settings for trying it out: no sign-in, and sources that are not there, so every part says why.
# An estate people use signs in with OIDC; see deploy/ for the settings it mounts.
port: 8080
# readOnly: true   # write to no tool (no silences, no debug, notes in memory), for trying Estate on real tools
# A screen on the wall: open /kiosk?token=… once on it (and ?team=… for one team's services).
# kiosk: { token: ${KIOSK_TOKEN}, environments: [ production, staging ], every: 30s }
catalog: /etc/estate/catalog.yaml

auth:
  sessionSecret: an-example-secret-for-trying-estate-out-only
  roles:
    viewer: [ developers ]
    operator: [ ops ]
  anonymous: { name: visitor, role: operator }

# Notes are kept in memory here. An estate people use keeps them in Postgres or, on AWS, in DynamoDB:
# notes: { postgres: ${NOTES_DATABASE_URL} }
# notes: { dynamodb: { table: estate-notes, region: eu-west-2 } }

sources:
  staging:
    prometheus: { url: http://prometheus.staging.invalid:9090 }
    alertmanager: { url: http://alertmanager.staging.invalid:9093 }
  production:
    prometheus: { url: http://prometheus.production.invalid:9090 }
    alertmanager: { url: http://alertmanager.production.invalid:9093 }
    # Or Grafana's alerting, in place of alertmanager, with a service account's token:
    # grafana: { url: https://grafana.production.invalid, token: ${GRAFANA_TOKEN} }
    # And Prometheus and Loki through Grafana, by their data sources' uids, in place of prometheus and loki:
    # grafana: { url: https://grafana.production.invalid, token: ${GRAFANA_TOKEN}, prometheus: prom-prod, loki: loki-prod }
    # Services' lines from Elasticsearch or OpenSearch, in place of Loki:
    # elasticsearch: { url: https://logs.production.invalid:9200, index: "logs-*", apiKey: ${ELASTIC_API_KEY} }
    kubernetes: { url: https://kubernetes.production.invalid:6443 }
    flux: {}
    # Or services on ECS, with CloudWatch's alarms and metrics, through the credentials AWS's tools would find:
    # aws: { region: eu-west-2 }
    # Langfuse, where the agents' runs are traced, with a project's keys:
    # langfuse: { publicKey: ${LANGFUSE_PUBLIC_KEY}, secretKey: ${LANGFUSE_SECRET_KEY} }
    # Datadog's monitors as alerts, silenced with downtimes, for the groups in this environment's tags:
    # datadog: { site: datadoghq.eu, apiKey: ${DD_API_KEY}, appKey: ${DD_APP_KEY}, tags: [ "env:production" ] }
    # Or Harness CD, in place of Flux, reading what each service's CD pipeline last deployed here:
    # harness: { account: ${HARNESS_ACCOUNT}, apiKey: ${HARNESS_API_KEY} }
    # Or Argo CD, in place of Flux, with a token that may read its Applications:
    # argo: { url: https://argocd.production.invalid, token: ${ARGO_TOKEN} }
    # How often each part is read, where the usual is too often for a tool's limits or its bill
    # (usually alerts 20s, metrics 30s, cluster 15s, deploys 30s; never more often than 5s):
    # every: { metrics: 2m, alerts: 1m }

builds:
  github: {}
  # And GitLab CI, for services whose catalog entry names build: { gitlab: { project, ref } }:
  # gitlab: { url: https://gitlab.example.com, token: ${GITLAB_TOKEN} }
  # And Jenkins, for services whose catalog entry names build: { jenkins: { job, branch } }, with a user's API token:
  # jenkins: { url: https://jenkins.example.com, user: estate, token: ${JENKINS_TOKEN} }
  # And TeamCity, for services whose catalog entry names build: { teamcity: { buildType, branch } }:
  # teamcity: { url: https://teamcity.example.com, token: ${TEAMCITY_TOKEN} }
  # And Harness CI, for services whose catalog entry names build: { harness: { org, project, pipeline } }:
  # harness: { account: ${HARNESS_ACCOUNT}, apiKey: ${HARNESS_API_KEY} }
  # How often builds are read; once a minute unless set:
  # every: 5m

# Ask AI on an alert (optional): Anthropic, OpenAI, xAI (Grok), Gemini, or any OpenAI-compatible server.
# ai: { provider: anthropic, apiKey: ${ANTHROPIC_API_KEY}, model: claude-sonnet-4-5 }
# ai: { provider: openai, apiKey: ${OPENAI_API_KEY}, model: gpt-4.1 }
# ai: { provider: xai, apiKey: ${XAI_API_KEY}, model: grok-4 }
# ai: { provider: gemini, apiKey: ${GEMINI_API_KEY}, model: gemini-2.5-flash }  # or GOOGLE_API_KEY
# ai: { provider: openai-compatible, url: http://vllm.example/v1, model: my-model }
