# An estate on other kinds of tool, for the pages' tests: EKS with Grafana's alerting, Elasticsearch, Argo CD and
# GitLab; ECS with CloudWatch; and an environment read wholly from Datadog.
environments:
  - { name: eks, title: EKS, sources: eks }
  - { name: aws, title: ECS, sources: aws }
  - { name: datadog, title: Datadog, sources: datadog }

services:
  - name: storefront
    description: The pages customers browse and buy from
    environments: [ eks ]
    runtime: { kubernetes: { namespace: shop, workloads: [ { kind: Deployment, name: storefront } ] } }
    deploy: { argo: { application: storefront } }
    build: { gitlab: { project: shop/storefront } }
    load:
      requests: sum(rate(http_requests_total{app="storefront"}[1m]))
      errors: sum(rate(http_requests_total{app="storefront",code=~"5.."}[1m]))

  - name: search
    description: Finds products as customers type; its lines are not shipped to Elasticsearch
    environments: [ eks ]
    runtime: { kubernetes: { namespace: shop, workloads: [ { kind: Deployment, name: search } ] } }

  - name: checkout
    description: Takes the money
    environments: [ aws ]
    runtime: { ecs: { cluster: shop, service: checkout } }
    build: { gitlab: { project: shop/checkout } }
    jobs: [ { kind: ScheduledTask, name: checkout-nightly-export } ]
    load:
      requests: SELECT SUM(RequestCount) FROM SCHEMA("AWS/ApplicationELB", LoadBalancer)

  - name: payments
    description: Charges cards, watched in Datadog and built by Jenkins
    environments: [ datadog ]
    build: { jenkins: { job: shop/payments, branch: main } }
    logs: { mask: [ "\\d{16}" ] }
    load:
      requests: sum:trace.http.request.hits{service:payments}.as_rate()
      p99: p99:trace.http.request{service:payments}

  - name: ledger
    description: Keeps the books, built by TeamCity and deployed by Harness
    environments: [ datadog ]
    build: { teamcity: { buildType: Shop_Ledger, branch: main } }
    deploy: { harness: { org: default, project: shop, pipeline: ledger_cd } }
