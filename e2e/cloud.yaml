# Estate against the fake tools in e2e/cloud-tools.ts (and e2e/tools.ts for EKS's cluster, and its Prometheus, which
# Estate reaches only through the fake Grafana's data source proxy).
port: 8183
metrics: { port: 9465 }
catalog: e2e/cloud-catalog.yaml

auth:
  sessionSecret: an-example-secret-for-trying-estate-out-only
  roles: { viewer: [ developers ], operator: [ ops ] }
  anonymous: { name: visitor, role: operator }

sources:
  eks:
    kubernetes: { url: http://127.0.0.1:8282, token: fake }
    grafana: { url: http://127.0.0.1:8283, token: glsa-e2e, prometheus: prom-eks }
    elasticsearch: { url: http://127.0.0.1:8283, apiKey: e2e }
    argo: { url: http://127.0.0.1:8283, token: argo-e2e }
  aws:
    aws: { region: eu-west-2, endpoint: http://127.0.0.1:8283/aws }
  datadog:
    datadog: { url: http://127.0.0.1:8283/datadog, apiKey: e2e-api, appKey: e2e-app, tags: [ "env:production" ] }
    harness: { url: http://127.0.0.1:8283/harness, account: e2e, apiKey: harness-e2e }

builds:
  gitlab: { url: http://127.0.0.1:8283, token: glpat-e2e }
  jenkins: { url: http://127.0.0.1:8283/jenkins, user: estate, token: jenkins-e2e }
  teamcity: { url: http://127.0.0.1:8283/teamcity, token: teamcity-e2e }
