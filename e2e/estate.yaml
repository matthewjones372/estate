# Estate against the fake tools in e2e/tools.ts, for the pages' tests.
port: 8181
catalog: examples/catalog.yaml

auth:
  sessionSecret: an-example-secret-for-trying-estate-out-only
  roles: { viewer: [ developers ], operator: [ ops ] }
  anonymous: { name: visitor, role: operator }

# A screen on the wall signs in at /kiosk?token=e2e-screen, and shows each environment for a few seconds.
kiosk: { token: e2e-screen, environments: [ production, staging ], every: 5s }

# A self-hosted model, faked in e2e/tools.ts, for Ask AI.
ai: { provider: openai-compatible, url: http://127.0.0.1:8282/v1, model: e2e-model }

# An agent's token for /mcp, which e2e/mcp.pw.ts drives with the MCP SDK's client.
mcp: { tokens: [ { name: e2e-agent, token: e2e-agent-token-of-at-least-32-chars, role: operator } ] }

sources:
  staging:
    prometheus: { url: http://127.0.0.1:8282 }
  production:
    prometheus: { url: http://127.0.0.1:8282 }
    alertmanager: { url: http://127.0.0.1:8282 }
    kubernetes: { url: http://127.0.0.1:8282, token: fake }
    flux: {}
    langfuse: { url: http://127.0.0.1:8282, publicKey: pk-lf-e2e, secretKey: sk-lf-e2e }

builds:
  github: { url: http://127.0.0.1:8282 }
